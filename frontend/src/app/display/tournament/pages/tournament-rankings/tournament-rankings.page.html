@if (vm$ | async; as vm) {
  <app-tournament-header [tournament]="vm.tournament">
    <app-tournament-actions [tournament]="vm.tournament" />
  </app-tournament-header>
  <app-tournament-nav [tournamentId]="tournamentId" />

  <div class="rankings-layout">
    <div class="rankings-filter">
      <mat-form-field appearance="outline">
        <mat-label>Groupe</mat-label>
        <mat-select [ngModel]="selectedGroupName()" (ngModelChange)="onGroupFilterChange($event)">
          @for (option of vm.groupOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    @for (group of vm.rankings; track group.groupId) {
      <div class="group-ranking">
        <h2>{{ group.title }}</h2>
        <app-ranking-table [ranking]="group.ranking" />
      </div>
    }
  </div>
}
