@if (vm$ | async; as vm) {
  <app-tournament-header [tournament]="vm.tournament">
    @if (vm.canEditGroups) {
      <button mat-raised-button color="primary" (click)="openGenerateModal()">
        <mat-icon>shuffle</mat-icon>
        Générer les groupes
      </button>
    }
    <app-tournament-actions [tournament]="vm.tournament" />
  </app-tournament-header>
  <app-tournament-nav [tournamentId]="tournamentId" />

  @if (vm.isEmpty) {
    <div class="empty-state">
      <mat-icon>grid_view</mat-icon>
      <p>Aucun groupe généré</p>
      @if (vm.canEditGroups) {
        <button mat-stroked-button (click)="openGenerateModal()">Générer les groupes</button>
      }
    </div>
  } @else {
    <app-group-list
      [groups]="vm.groups"
      [isDraft]="vm.canEditGroups"
      (swapRequested)="openSwapModal(vm.groups, $event)">
    </app-group-list>
  }
}
