sonar.projectKey=alecberney_fvjc-sport-tournament
sonar.organization=alecberney
sonar.projectName=fvjc-sport-tournament

# Backend (Java) + frontend (TypeScript) are analysed as a single project.
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java

sonar.sourceEncoding=UTF-8

# Test helpers and generated/vendored assets carry no product logic.
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/**/*.fakes.ts,backend/src/main/resources/static/**

# Java analysis needs the compiled bytecode; produced by `mvn test`.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Coverage reports — regenerate with:
#   backend:  cd backend && ./mvnw test -Dfrontend.skip=true
#   frontend: cd frontend && npm run test:coverage
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info
