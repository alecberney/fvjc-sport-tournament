name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode test -Dfrontend.skip=true

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

  e2e:
    name: E2E — Playwright on the packaged app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Production-style single jar: the Maven build also builds the Angular app into static/.
      - name: Build app jar
        working-directory: backend
        run: ./mvnw --batch-mode package -DskipTests

      # Fresh, empty SQLite database for every run — Liquibase creates the schema on startup.
      - name: Start app
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-db"
          TOURNAMENT_DB_PATH="$RUNNER_TEMP/e2e-db/tournament.db" \
            nohup java -jar backend/target/tournament-*.jar > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8081/api/tournaments && exit 0
            sleep 2
          done
          echo "App did not start in time"; cat "$RUNNER_TEMP/app.log"; exit 1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Uses the runner's preinstalled Google Chrome (channel: 'chrome'), no browser download.
      - name: Run e2e tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: App log
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"

  sonar:
    name: SonarCloud — analysis & coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs the full history to attribute issues to commits and to
          # compute the "new code" period.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Runs the tests with the JaCoCo agent attached, producing
      # backend/target/site/jacoco/jacoco.xml.
      - name: Backend coverage
        working-directory: backend
        run: ./mvnw --batch-mode test -Dfrontend.skip=true

      # Dependency jars let the Java analyser resolve types it would otherwise
      # skip. sonar.java.libraries wants a comma-separated list, so the paths go
      # through an env var rather than the committed properties file.
      - name: Export backend dependency classpath
        working-directory: backend
        run: |
          ./mvnw --batch-mode -q dependency:build-classpath -Dmdep.outputFile=target/sonar-classpath.txt -Dmdep.pathSeparator=, -Dfrontend.skip=true
          echo "SONAR_JAVA_LIBRARIES=$(cat target/sonar-classpath.txt)" >> "$GITHUB_ENV"

      # Produces frontend/coverage/frontend/lcov.info.
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      # Istanbul writes paths relative to the frontend workspace (src/app/...),
      # but the scanner resolves them from the repo root — prefix them so the
      # coverage lands on the right files.
      - name: Rebase frontend coverage paths on the repo root
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/frontend/lcov.info

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.java.libraries=${{ env.SONAR_JAVA_LIBRARIES }}
